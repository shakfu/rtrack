# Configuration for `cargo audit`, run by .github/workflows/audit.yml.
#
# An advisory rtrack cannot fix from here goes in `ignore` below, one ID per
# line with a comment naming the dependency path and the way out. Listing them
# keeps the job meaningful: permanently red teaches people to ignore it, and
# ignoring everything reports nothing.

[advisories]
ignore = []

# Unmaintained and unsound notices fail the job like vulnerabilities. One that
# cannot be fixed from here goes in `ignore` with its reason.
[output]
deny = ["unmaintained", "unsound"]
quiet = false  # required: cargo-audit 0.22 rejects [output] without it
