[package]
name = "rtrack-core"
version = "0.1.1"
edition = "2021"
description = "Headless tracker core: engine, audio, MIDI, samples, and data model"

[dependencies]
midir = "0.10"
rusty_link = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustysynth = "1"
cpal = "0.15"
fundsp = "0.23"
dasp = { version = "0.11", features = ["signal", "slice"] }
hound = "3.5"
flacenc = "0.5"
rtrb = "0.3"
toml = "0.8"
