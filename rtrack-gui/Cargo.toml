[package]
name = "rtrack-gui"
version = "0.1.3"
edition = "2021"
rust-version = "1.95"
description = "GUI frontend for rtrack music tracker"
license = "GPL-3.0-or-later"
repository = "https://github.com/shakfu/rtrack"
authors = ["Shakeeb Alireza"]
keywords = ["tracker", "music", "gui", "midi", "audio"]
categories = ["multimedia::audio"]
readme = "README.md"

[[bin]]
name = "rtrack-gui"
path = "src/main.rs"

[dependencies]
rtrack-core = { version = "0.1.3", path = "../rtrack-core" }
# Defaults minus wgpu (0.34 made it the default; rtrack stays on glow) and
# minus winit's title-text decorations, which pull in unmaintained ttf-parser.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
# Adwaita window decorations on Wayland compositors without server-side ones
# (GNOME), drawn without the title string.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
rfd = "0.15"
rustfft = "6"

[dev-dependencies]
tempfile = "3"
hound = "3.5"
