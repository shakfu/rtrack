version: 2

updates:
  # Cargo dependencies. Grouped rather than one PR per crate: the workspace
  # pins around forty direct dependencies, and a weekly flood of single-crate
  # PRs is how dependency automation gets switched off again.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps of settled crates, together in one PR. These are
      # the ones CI can be trusted to judge on its own.
      routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The pre-1.0 UI and audio stacks make breaking changes in *minor*
      # versions, so their bumps are migrations rather than updates and want
      # to be taken deliberately, one at a time. Dependabot will still raise
      # majors for them.
      - dependency-name: egui
        update-types: ["version-update:semver-minor"]
      - dependency-name: eframe
        update-types: ["version-update:semver-minor"]
      - dependency-name: ratatui
        update-types: ["version-update:semver-minor"]
      - dependency-name: crossterm
        update-types: ["version-update:semver-minor"]
      - dependency-name: cpal
        update-types: ["version-update:semver-minor"]
      - dependency-name: fundsp
        update-types: ["version-update:semver-minor"]

  # The workflows themselves, so pinned action versions do not rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
