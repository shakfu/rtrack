name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  # Note: warnings are denied via the clippy step's `-- -D warnings`, which
  # applies only to workspace crates. Setting RUSTFLAGS globally would apply
  # it to dependencies too and fail the build on third-party code.

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux audio and MIDI headers
        if: runner.os == 'Linux'
        # cpal and midir both bind to ALSA; rusty_link needs CMake to build
        # its C++ sources.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # Clippy drives rustc, so this denies ordinary rustc warnings
        # (unused imports and friends) in workspace crates as well.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Documentation
        # Broken intra-doc links are invisible until docs.rs renders them as
        # dead text, which for a published crate is the first thing a reader
        # sees.
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Tests
        # No audio device or MIDI port exists on a CI runner. The suite is
        # built to run headless, so this must pass without one.
        run: cargo test --workspace

      - name: Generated examples are current
        # The committed example songs are build artifacts. This catches them
        # drifting from the code that produces them, without a test writing
        # into the repository.
        run: cargo xtask regen-examples --check

  msrv:
    name: MSRV (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # egui 0.36 needs 1.95; the core and TUI keep the lower floor.
          - toolchain: 1.89.0
            packages: -p rtrack-core -p rtrack-tui -p xtask
          - toolchain: 1.95.0
            packages: --workspace
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux audio and MIDI headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev cmake

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2

      # Verifies the rust-version declared in Cargo.toml is honest.
      - name: Build
        run: cargo build ${{ matrix.packages }}
