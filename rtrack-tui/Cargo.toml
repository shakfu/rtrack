[package]
name = "rtrack-tui"
version = "0.1.3"
edition = "2021"
rust-version = "1.89"
description = "TUI frontend for rtrack music tracker"
license = "GPL-3.0-or-later"
repository = "https://github.com/shakfu/rtrack"
authors = ["Shakeeb Alireza"]
keywords = ["tracker", "music", "tui", "midi", "audio"]
categories = ["multimedia::audio", "command-line-utilities"]
readme = "README.md"

[[bin]]
name = "rtrack"
path = "src/main.rs"

[lib]
name = "rtrack_tui"
path = "src/lib.rs"

[dependencies]
rtrack-core = { version = "0.1.3", path = "../rtrack-core" }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hound = "3.5"
tempfile = "3"
