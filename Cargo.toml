[package]
name = "rtrack"
version = "0.1.0"
edition = "2021"
description = "A TUI music tracker built with ratatui"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
midir = "0.10"
rusty_link = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustysynth = "1"
cpal = "0.15"

[dev-dependencies]
