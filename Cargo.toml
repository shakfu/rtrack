[workspace]
members = ["rtrack-core", "rtrack-tui", "rtrack-gui", "xtask"]
default-members = ["rtrack-tui"]
resolver = "2"

# Optimize audio callback code in all workspace crates.
# Without this, loops and math in the real-time audio callback run at
# opt-level 0, risking buffer underruns and audible glitches.
[profile.dev]
opt-level = 1

# Optimize dependencies even in debug builds. DSP crates like fundsp do
# per-sample processing that is unusably slow without optimization.
[profile.dev.package."*"]
opt-level = 2
